<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고객 문의 채팅 관리</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d1f23;--sub:#6b7280;--line:#e5e7eb;--accent:#ff7e36;--green:#16a34a;--red:#dc2626;}
  @media (prefers-color-scheme: dark){ :root{--bg:#111316;--card:#1c1f24;--text:#eceef1;--sub:#9aa1ab;--line:#2c3037;} }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;}
  main{max-width:640px;margin:0 auto;padding:16px;}
  h1{font-size:20px;margin:8px 0 16px;}
  h2{font-size:16px;margin:0 0 10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  label{display:block;font-weight:600;margin:12px 0 4px;}
  .hint{color:var(--sub);font-size:13px;font-weight:400;}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--text);}
  textarea{min-height:110px;resize:vertical;}
  button{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:700;font:inherit;font-weight:700;cursor:pointer;}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .link{word-break:break-all;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;flex:1;min-width:0;}
  .ok{color:var(--green);} .bad{color:var(--red);}
  .item{border-top:1px solid var(--line);padding:10px 0;}
  .item:first-child{border-top:0;}
  .item .m{color:var(--sub);font-size:13px;margin-top:2px;}
  .item.done{opacity:.5;}
  details summary{cursor:pointer;}
  .msg{font-size:13px;margin:4px 0;white-space:pre-wrap;}
  .msg b{color:var(--sub);font-weight:600;}
  .switch{display:flex;align-items:center;gap:8px;font-weight:600;}
  .switch input{width:20px;height:20px;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;}
  .hidden{display:none;}
</style>
</head>
<body>
<main>
  <h1>💬 고객 문의 채팅 관리</h1>

  <!-- 로그인 (현황판과 같은 계정) -->
  <div id="loginBox" class="card hidden">
    <h2>현황판 계정으로 로그인</h2>
    <label>이메일</label><input id="email" type="email" autocomplete="username">
    <label>비밀번호</label><input id="pw" type="password" autocomplete="current-password">
    <p id="loginErr" class="bad"></p>
    <button id="loginBtn">로그인</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>고객에게 보낼 링크</h2>
      <p class="hint">당근 비즈프로필 자동응답, 인스타 프로필·자동응답에 이 링크를 넣으세요.</p>
      <div class="row"><div id="chatLink" class="link"></div><button id="copyBtn" class="ghost">복사</button></div>
      <p id="aiStatus" class="hint"></p>
    </div>

    <div class="card" id="settingsCard">
      <h2>채팅 설정</h2>
      <p id="ownerOnly" class="hint hidden">설정은 관리자(업체 대표 계정)만 바꿀 수 있어요.</p>
      <div class="switch"><input id="enabled" type="checkbox"><span>고객 문의 채팅 켜기</span></div>
      <label>업체 이름 <span class="hint">(비우면 현황판 업체명 사용)</span></label>
      <input id="businessName" type="text" maxlength="50">
      <label>대표 연락처</label>
      <input id="phone" type="text" maxlength="30" placeholder="010-0000-0000">
      <label>가격 안내 <span class="hint">(여기 적은 가격만 고객에게 안내해요)</span></label>
      <textarea id="priceGuide" maxlength="3000" placeholder="예)&#10;아반떼: 하루 5만원, 한 달 70만원&#10;카니발: 하루 10만원&#10;보험 포함, 만 26세 이상"></textarea>
      <label>업체 안내 <span class="hint">(영업시간, 위치, 대여 조건, 필요 서류 등)</span></label>
      <textarea id="extraInfo" maxlength="3000" placeholder="예)&#10;영업시간 09:00~19:00, 일요일 휴무&#10;위치: 장성읍 ○○로 12&#10;면허 1년 이상"></textarea>
      <label>하루 최대 답변 수 <span class="hint">(요금 보호용, 기본 300)</span></label>
      <input id="dailyLimit" type="number" min="10" max="5000" placeholder="300">
      <p></p>
      <button id="saveBtn">저장</button>
    </div>

    <div class="card">
      <h2>예약·상담 요청</h2>
      <p class="hint">예약 요청은 현황판 일정에도 자동으로 들어가요. 고객과 통화 후 확정 또는 취소를 눌러주세요.</p>
      <div id="leads"><p class="hint">아직 없어요.</p></div>
    </div>

    <div class="card">
      <h2>최근 대화</h2>
      <div id="sessions"><p class="hint">아직 없어요.</p></div>
    </div>

    <button class="ghost" id="logoutBtn">로그아웃</button>
  </div>
</main>
<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, get, set, update, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // index.html 의 firebaseConfig 와 같은 값
  const app = initializeApp({
    apiKey: "AIzaSyB0snoSwJ0wTOxI8vRf2GU27VF05zN0c7k",
    authDomain: "fleet-board-f2345.firebaseapp.com",
    databaseURL: "https://fleet-board-f2345-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "fleet-board-f2345",
    storageBucket: "fleet-board-f2345.firebasestorage.app",
    messagingSenderId: "613571323567",
    appId: "1:613571323567:web:0003a663f5891364ef565a"
  });
  const db = getDatabase(app);
  const auth = getAuth(app);
  const $ = id => document.getElementById(id);
  const FIELDS = ['businessName', 'phone', 'priceGuide', 'extraInfo'];
  let companyId = '', isOwner = false;

  function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(()=> el.style.display = 'none', 2200); }
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function when(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
  const P = sub => 'companies/' + companyId + '/' + sub;

  $('loginBtn').onclick = async ()=>{
    $('loginErr').textContent = '';
    try{ await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pw').value); }
    catch(e){ $('loginErr').textContent = '로그인에 실패했어요. 이메일과 비밀번호를 확인해주세요.'; }
  };
  $('logoutBtn').onclick = ()=> signOut(auth);

  onAuthStateChanged(auth, async user=>{
    $('loginBox').classList.toggle('hidden', !!user);
    $('app').classList.toggle('hidden', !user);
    if(!user) return;
    try{
      const idx = await get(ref(db, 'userIndex/' + user.uid));
      companyId = idx.exists() ? idx.val().companyId : '';
      if(!companyId){ toast('소속 업체를 찾지 못했어요. 현황판에서 먼저 업체를 만들어주세요.'); return; }
      const m = await get(ref(db, P('members/' + user.uid)));
      isOwner = m.exists() && m.val().role === 'owner';
    }catch(e){ console.error(e); toast('업체 정보를 불러오지 못했어요'); return; }
    start();
  });

  function start(){
    const link = location.origin + location.pathname.replace(/[^/]*$/, '') + 'chat.html?c=' + encodeURIComponent(companyId);
    $('chatLink').textContent = link;
    $('copyBtn').onclick = async ()=>{ try{ await navigator.clipboard.writeText(link); toast('링크를 복사했어요'); }catch(e){ toast('길게 눌러서 복사해주세요'); } };

    $('ownerOnly').classList.toggle('hidden', isOwner);
    document.querySelectorAll('#settingsCard input, #settingsCard textarea, #saveBtn').forEach(el => el.disabled = !isOwner);

    onValue(ref(db, P('aiSettings')), snap=>{
      const key = snap.exists() ? snap.val().key : '';
      $('aiStatus').innerHTML = /^sk-ant-/.test(key || '')
        ? '<span class="ok">✓ Claude 키가 연결돼 있어요 (현황판 🤖 AI 설정)</span>'
        : '<span class="bad">⚠ 현황판의 "🤖 AI 설정"에 Claude 키(sk-ant-로 시작)를 넣어야 채팅이 답변해요.</span>';
    }, ()=>{});

    get(ref(db, P('customerChat/settings'))).then(snap=>{
      const s = snap.val() || {};
      $('enabled').checked = !!s.enabled;
      FIELDS.forEach(f => $(f).value = s[f] || '');
      $('dailyLimit').value = s.dailyLimit || '';
    }).catch(e=>{ console.error(e); toast('설정을 불러오지 못했어요 (권한 확인 필요)'); });

    $('saveBtn').onclick = async ()=>{
      const data = { enabled: $('enabled').checked, updatedAt: new Date().toISOString() };
      FIELDS.forEach(f => data[f] = $(f).value.trim());
      const lim = parseInt($('dailyLimit').value, 10);
      data.dailyLimit = lim > 0 ? lim : null;
      try{ await update(ref(db, P('customerChat/settings')), data); toast('저장했어요'); }
      catch(e){ console.error(e); toast('저장 실패 - 관리자 권한을 확인해주세요'); }
    };

    // 확정할 때 고를 차량 목록 (현황판 차량 데이터)
    let vehicles = [];
    onValue(ref(db, P('vehicles')), snap=>{
      const v = snap.val() || [];
      vehicles = (Array.isArray(v) ? v : Object.values(v)).filter(x => x && x.plate);
    }, ()=>{});
    const statusText = v => v.status === '대기' ? '대기' : v.status === '준비중' ? '준비중' : (v.type === '장기' ? '장기' : '운행중');

    // 일정 제목 만들기 (functions/chat-core.js 의 bookingSchedule 제목과 같은 모양)
    const shortWhen = (d, t) => { if(!d) return ''; const p = d.split('-'); let s = (+p[1]) + '/' + (+p[2]);
      if(t){ const [h, mi] = t.split(':').map(Number); s += ` ${h}시${mi ? mi + '분' : ''}`; } return s; };
    const rangeOf = l => { const from = shortWhen(l.startDate, l.startTime); const to = l.endDate ? shortWhen(l.endDate, l.endTime) : (l.period || ''); return to ? `${from} ~ ${to}` : from; };
    const titleOf = (l, confirmed, plate) =>
      `${confirmed ? '✅ 예약확정' : '📅 예약요청'} ${rangeOf(l)} ${l.model || ''}${plate ? `(${plate})` : ''} · ${l.name || '고객'}`.slice(0, 100);

    // 현황판 직원 메신저(chat)에 시스템 메시지로 기록. 실패해도 예약 처리는 그대로.
    async function postToStaffChat(text){
      try{ await push(ref(db, P('chat')), { text, uid: 'system', email: '현황판', at: new Date().toISOString(), type: 'system' }); }
      catch(e){ console.warn('메신저 기록 실패', e); }
    }
    const who = l => `${l.name || '고객'} ${l.phone || ''}`.trim();

    // 날짜 변경: 예약 날짜가 바뀌면 문의 목록, 현황판 일정(날짜·제목), 차량 카드 표시가 같이 바뀜
    function openDates(k, l){
      const box = $('pick-' + k);
      if(!box.classList.contains('hidden') && box.dataset.mode === 'dates'){ box.classList.add('hidden'); return; }
      box.dataset.mode = 'dates';
      const inp = 'style="padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;"';
      box.innerHTML = `
        <label>대여 시작</label>
        <div class="row"><input type="date" id="sd-${esc(k)}" value="${esc(l.startDate || '')}" ${inp}><input type="time" id="st-${esc(k)}" value="${esc(l.startTime || '')}" ${inp}></div>
        <label>반납 <span class="hint">(연장이면 여기를 늦추세요)</span></label>
        <div class="row"><input type="date" id="ed-${esc(k)}" value="${esc(l.endDate || '')}" ${inp}><input type="time" id="et-${esc(k)}" value="${esc(l.endTime || '')}" ${inp}></div>
        <p></p><button id="dok-${esc(k)}">날짜 저장</button>`;
      box.classList.remove('hidden');
      $('dok-' + k).onclick = async ()=>{
        const n = { ...l, startDate: $('sd-' + k).value, startTime: $('st-' + k).value, endDate: $('ed-' + k).value, endTime: $('et-' + k).value };
        if(!n.startDate){ toast('시작 날짜를 넣어주세요'); return; }
        if(n.endDate && n.endDate < n.startDate){ toast('반납 날짜가 시작보다 빨라요'); return; }
        if(n.endDate) n.period = '';
        const confirmed = l.status === 'confirmed';
        const lk = P('customerChat/leads/' + k);
        const changes = { [lk + '/startDate']: n.startDate, [lk + '/startTime']: n.startTime, [lk + '/endDate']: n.endDate,
                          [lk + '/endTime']: n.endTime, [lk + '/period']: n.period || '', [lk + '/scheduleTitle']: titleOf(n, false, ''),
                          [lk + '/changedAt']: new Date().toISOString() };
        if(l.scheduleKey){
          const sk = P('schedules/' + l.scheduleKey);
          Object.assign(changes, { [sk + '/date']: n.startDate, [sk + '/title']: titleOf(n, confirmed, confirmed ? l.plate : ''),
            [sk + '/resvStart']: n.startDate, [sk + '/resvStartTime']: n.startTime, [sk + '/resvEnd']: n.endDate,
            [sk + '/resvEndTime']: n.endTime, [sk + '/resvPeriod']: n.period || '' });
        }
        try{
          await update(ref(db), changes);
          await postToStaffChat(`🔁 예약 날짜 변경: ${l.model || ''}${confirmed && l.plate ? '(' + l.plate + ')' : ''} ${rangeOf(l)} → ${rangeOf(n)} · ${who(l)}`);
          toast('날짜를 바꿨어요. 현황판 일정과 차량 표시에도 반영됐어요');
        }
        catch(e){ console.error(e); toast('저장 실패 - 권한을 확인해주세요'); }
      };
    }

    // 예약 확정: 차량을 고르면 일정 제목에 차량번호를 넣고, 현황판 차량 카드에 "예약" 표시가 뜨게 resvPlate 저장
    function openPicker(k, l){
      const box = $('pick-' + k);
      if(!box.classList.contains('hidden') && box.dataset.mode === 'pick'){ box.classList.add('hidden'); return; }
      box.dataset.mode = 'pick';
      const same = vehicles.filter(v => (v.model || '').trim() === (l.model || '').trim());
      const others = vehicles.filter(v => !same.includes(v));
      const opt = v => `<option value="${esc(v.plate)}" ${v.plate === l.plate ? 'selected' : ''}>${esc(v.plate)} · ${esc(v.model || '')} (${statusText(v)})</option>`;
      box.innerHTML = `
        <label>어느 차량으로 확정할까요?</label>
        <select id="sel-${esc(k)}" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;">
          ${same.length ? `<optgroup label="${esc(l.model)}">${same.map(opt).join('')}</optgroup>` : ''}
          <optgroup label="다른 차량">${others.map(opt).join('')}</optgroup>
          <option value="">차량은 나중에 정하기</option>
        </select>
        <p></p><button id="ok-${esc(k)}">이 차량으로 확정</button>`;
      box.classList.remove('hidden');
      $('ok-' + k).onclick = async ()=>{
        const plate = $('sel-' + k).value;
        const title = titleOf(l, true, plate);
        const changes = { [P('customerChat/leads/' + k + '/status')]: 'confirmed',
                          [P('customerChat/leads/' + k + '/plate')]: plate || null,
                          [P('customerChat/leads/' + k + '/done')]: true,
                          [P('customerChat/leads/' + k + '/decidedAt')]: new Date().toISOString() };
        if(l.scheduleKey){
          const sk = P('schedules/' + l.scheduleKey);
          changes[sk + '/title'] = title;
          changes[sk + '/resvStatus'] = 'confirmed';
          changes[sk + '/resvPlate'] = plate || null;
        }
        try{
          await update(ref(db), changes);
          const changed = l.status === 'confirmed';
          await postToStaffChat(`${changed ? '🚗 예약 차량 변경' : '✅ 예약 확정'}: ${l.model || ''} ${rangeOf(l)}${plate ? ' · 차량 ' + plate : ' · 차량 미정'} · ${who(l)}`);
          toast(plate ? `${plate} 차량으로 확정했어요` : '확정했어요 (차량은 나중에)');
        }
        catch(e){ console.error(e); toast('저장 실패 - 권한을 확인해주세요'); }
      };
    }

    onValue(query(ref(db, P('customerChat/leads')), limitToLast(50)), snap=>{
      const rows = [];
      snap.forEach(ch => { rows.push([ch.key, ch.val()]); });
      rows.reverse();
      const badge = l => l.type === 'booking'
        ? (l.status === 'confirmed' ? '<span class="ok">✅ 예약 확정</span>' : l.status === 'cancelled' ? '<span class="bad">취소</span>' : '<span style="color:var(--accent)">📅 예약 요청</span>')
        : l.type === 'form' ? '📝 홈페이지 상담신청' : '📞 상담 요청';
      const body = l => l.type === 'booking'
        ? `${esc(l.model)} · ${esc(l.startDate)} ${esc(l.startTime || '')}${l.endDate ? ' ~ ' + esc(l.endDate) + ' ' + esc(l.endTime || '') : ''}${l.period ? ' (' + esc(l.period) + ')' : ''}${l.note ? '<br>' + esc(l.note) : ''}`
        : l.type === 'form'
          ? `${esc(l.rentalType)} ${esc(l.rentalPeriod)}${l.rentalType === '단기대여' ? '일' : '개월'}${l.carClass ? ' · ' + esc(l.carClass) : ''} · ${esc(l.rentalRegion)}`
            + `<br><span class="hint">${l.birthdate ? '생년월일 ' + esc(l.birthdate) : ''}${l.agreeMarketing ? ' · 마케팅 동의' : ''}</span>${l.userMsg ? '<br>' + esc(l.userMsg) : ''}`
          : esc(l.request);
      const actions = (k, l) => {
        if(l.type === 'booking' && l.status === 'pending')
          return `<button data-act="pick" data-lead="${esc(k)}">확정</button><button class="ghost" data-act="dates" data-lead="${esc(k)}">날짜 변경</button><button class="ghost" data-act="cancel" data-lead="${esc(k)}">취소</button>`;
        if(l.type === 'booking' && l.status === 'confirmed')
          return `<button class="ghost" data-act="pick" data-lead="${esc(k)}">차량 변경</button><button class="ghost" data-act="dates" data-lead="${esc(k)}">날짜 변경</button><button class="ghost" data-act="cancel" data-lead="${esc(k)}">취소</button>`;
        if(l.type === 'booking') return '';
        return `<button class="ghost" data-act="done" data-lead="${esc(k)}" data-done="${l.done ? 1 : 0}">${l.done ? '되돌리기' : '처리 완료'}</button>`;
      };
      const byKey = Object.fromEntries(rows);
      $('leads').innerHTML = rows.length ? rows.map(([k, l]) => `
        <div class="item ${l.done && l.status !== 'confirmed' ? 'done' : ''}">
          <div class="row" style="justify-content:space-between">
            <b>${badge(l)} · ${esc(l.name || '이름 없음')} · <a href="tel:${esc(l.phone)}">${esc(l.phone)}</a></b>
            <span class="row">${actions(k, l)}</span>
          </div>
          <div>${body(l)}${l.plate ? ` · 🚗 <b>${esc(l.plate)}</b>` : ''}</div>
          <div class="picker hidden" id="pick-${esc(k)}"></div>
          <div class="m">${when(l.createdAt)}${l.channel && l.channel !== 'web' ? ' · ' + esc(l.channel) : ''}</div>
        </div>`).join('') : '<p class="hint">아직 없어요.</p>';
      $('leads').querySelectorAll('button[data-lead]').forEach(b => b.onclick = async ()=>{
        const k = b.dataset.lead, l = byKey[k] || {};
        try{
          if(b.dataset.act === 'done'){ await set(ref(db, P('customerChat/leads/' + k + '/done')), b.dataset.done !== '1'); return; }
          if(b.dataset.act === 'pick') return openPicker(k, l);
          if(b.dataset.act === 'dates') return openDates(k, l);
          if(!confirm('이 예약을 취소할까요? 현황판 일정에서도 지워져요.')) return;
          const changes = { [P('customerChat/leads/' + k + '/status')]: 'cancelled',
                            [P('customerChat/leads/' + k + '/done')]: true,
                            [P('customerChat/leads/' + k + '/decidedAt')]: new Date().toISOString() };
          if(l.scheduleKey) changes[P('schedules/' + l.scheduleKey)] = null;
          await update(ref(db), changes);
          await postToStaffChat(`❌ 예약 취소: ${l.model || ''} ${rangeOf(l)}${l.plate ? ' · 차량 ' + l.plate : ''} · ${who(l)}`);
          toast('취소했어요');
        }catch(e){ console.error(e); toast('저장 실패 - 권한을 확인해주세요'); }
      });
    }, e=>{ console.error(e); $('leads').innerHTML = '<p class="bad">불러오기 실패 (권한 확인 필요)</p>'; });

    onValue(query(ref(db, P('customerChat/sessions')), orderByChild('updatedAt'), limitToLast(20)), snap=>{
      const rows = [];
      snap.forEach(ch => { rows.push(ch.val()); });
      rows.reverse();
      $('sessions').innerHTML = rows.length ? rows.map(s => {
        const msgs = Array.isArray(s.messages) ? s.messages : [];
        const first = (msgs.find(m => m.role === 'user') || {}).text || '';
        return `<details class="item"><summary>${s.hasLead ? '📞 ' : ''}${esc(first.slice(0, 40))} <span class="hint">· ${when(s.updatedAt)} · ${msgs.length}개</span></summary>
          ${msgs.map(m => `<div class="msg"><b>${m.role === 'user' ? '고객' : 'AI'}</b> ${esc(m.text)}</div>`).join('')}</details>`;
      }).join('') : '<p class="hint">아직 없어요.</p>';
    }, e=>{ console.error(e); $('sessions').innerHTML = '<p class="bad">불러오기 실패 (권한 확인 필요)</p>'; });
  }
</script>
</body>
</html>
