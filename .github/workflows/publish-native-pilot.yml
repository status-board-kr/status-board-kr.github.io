name: 검증 APK 다운로드 주소 만들기
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: native-pilot-apk
          run-id: 37107303563
          github-token: ${{ github.token }}
          path: pilot-artifact
      - name: 검증한 APK만 별도 경로에 게시
        shell: bash
        run: |
          (cd pilot-artifact && sed 's@pilot-download/@@' SHA256.txt | sha256sum -c -)
          test -f pilot-artifact/status-board-native-pilot-0.1.1.apk
          git pull --ff-only origin main
          mkdir -p apk/native-pilot
          cp pilot-artifact/status-board-native-pilot-0.1.1.apk apk/native-pilot/
          cp pilot-artifact/READ-ME.md apk/native-pilot/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/native-pilot/
          if ! git diff --cached --quiet; then
            git commit -m "Publish separate native pilot 0.1.1 APK download"
            git push origin HEAD:main
          fi
