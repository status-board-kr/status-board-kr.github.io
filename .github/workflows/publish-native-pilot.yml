name: 검증 APK 다운로드 주소 만들기
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 승인한 통합 빌드 성공 확인
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 37129687145});
            if (run.conclusion !== 'success' || run.head_sha !== '3ca17b69d8daabdc8f2eb3a4e240c313e3c831dd' || run.path !== '.github/workflows/native-pilot-apk.yml') {
              throw new Error('Approved integrated APK build must succeed before publication');
            }
      - uses: actions/download-artifact@v4
        with:
          name: native-pilot-apk
          run-id: 37129687145
          github-token: ${{ github.token }}
          path: pilot-artifact
      - name: 검증한 APK만 별도 경로에 게시
        shell: bash
        run: |
          (cd pilot-artifact && sed 's@pilot-download/@@' SHA256.txt | sha256sum -c -)
          test -f pilot-artifact/status-board-native-pilot-0.2.1.apk
          grep -q "package: name='com.jangsung.fleet.nativepilot' versionCode='4' versionName='0.2.1-pilot'" pilot-artifact/pilot-package.txt
          git pull --ff-only origin main
          mkdir -p apk/native-pilot
          cp pilot-artifact/status-board-native-pilot-0.2.1.apk apk/native-pilot/
          cp pilot-artifact/READ-ME.md apk/native-pilot/
          cp pilot-artifact/pilot-package.txt apk/native-pilot/
          sed 's@pilot-download/@@' pilot-artifact/SHA256.txt > apk/native-pilot/SHA256-0.2.1.txt
          printf '%s\n' 'Source: 3ca17b69d8daabdc8f2eb3a4e240c313e3c831dd' 'Build: https://github.com/status-board-kr/status-board-kr.github.io/actions/runs/37129687145' > apk/native-pilot/BUILD-0.2.1.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/native-pilot/
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved integrated native pilot 0.2.1 APK download"
            git push origin HEAD:main
          fi
