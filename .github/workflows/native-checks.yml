name: 전용 앱 코드 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase 규칙 검사 도구 설치
        working-directory: native-android/rules-check
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 가상 자료로 기존 권한과 저장 경로 검사 (운영 DB 접근 없음)
        working-directory: native-android/rules-check
        run: npm test
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Firebase 공개 앱 설정 준비
        run: node native-android/scripts/prepare-client.cjs
      - name: 기존 앱·전용 앱 알림 호환 검사 (실제 전송 없음)
        run: node --test server/sendchatpush/push-targets.test.js server/aiconsult/inquiry-push.test.js
      - name: 전용 앱 컴파일 및 핵심 동작 검사 (APK 발행 없음)
        working-directory: native-android
        run: gradle :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-check-reports
          path: native-android/app/build/reports/
