name: 전용 앱 코드 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Firebase 공개 앱 설정 준비
        run: node native-android/scripts/prepare-client.cjs
      - name: 전용 앱 컴파일 및 핵심 동작 검사 (APK 발행 없음)
        working-directory: native-android
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-check-reports
          path: native-android/app/build/reports/
