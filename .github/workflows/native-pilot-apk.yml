name: 전용 앱 검증용 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nativepilot-debug-signing-v1
      - name: 공개 앱 설정 준비
        run: node native-android/scripts/prepare-client.cjs
      - name: 검증용 APK 및 동작 검사
        working-directory: native-android
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: 별도 설치 패키지 확인
        shell: bash
        run: |
          apk=native-android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > native-android/app/build/pilot-package.txt
          grep -q "package: name='com.jangsung.fleet.nativepilot'" native-android/app/build/pilot-package.txt
          mkdir -p pilot-download
          cp "$apk" pilot-download/status-board-native-pilot-0.1.0.apk
          cp native-android/docs/PILOT-VERIFY.md pilot-download/READ-ME.md
          sha256sum pilot-download/*.apk > pilot-download/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-pilot-apk
          path: pilot-download/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pilot-check-reports
          path: |
            native-android/app/build/reports/
            native-android/app/build/pilot-package.txt
