name: 코드 검증
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/aiconsult/package-lock.json
      - run: npm ci && npm test
      - run: npm ci && npm test
        working-directory: server/aiconsult
