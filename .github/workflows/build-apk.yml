name: APK 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 빌드할 때마다 자동으로 올라가는 앱 버전 (1.0.빌드번호)
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 기존 앱과 같은 서명키 준비
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo '배포 서명 Secrets 4개를 먼저 설정해주세요. 기존 키를 Secrets에 옮겨야 합니다. 새 키를 만들지 않습니다.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fleet-release.keystore"

      - name: 사이트 화면 파일을 앱 폴더로 자동 복사
        run: |
          APPW=status-board-app/status-board-app/www
          mkdir -p $APPW
          for f in index.html payment.html fleet-auth.js manifest.json sw.js icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp "$f" "$APPW/$f"; echo "copied $f"; fi
          done

      - name: 패키지 설치
        working-directory: status-board-app/status-board-app
        run: npm ci

      - name: 안드로이드 프로젝트 만들기
        working-directory: status-board-app/status-board-app
        run: npx cap add android

      - name: 권한·뒤로가기·설정 적용
        working-directory: status-board-app/status-board-app
        run: node scripts/setup-android.js && node scripts/setup-widget.js

      - name: 앱 아이콘 생성
        working-directory: status-board-app/status-board-app
        run: npx @capacitor/assets generate --android

      - name: 화면 파일 반영
        working-directory: status-board-app/status-board-app
        run: npx cap sync android

      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fleet-release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: status-board-app/status-board-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          # 기존 APK와 인증서가 다르면 배포를 중단해 설정 초기화를 방지합니다.
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APK_SIGNER" ]; then echo 'apksigner를 찾을 수 없습니다.'; exit 1; fi
          PREVIOUS_CERT=$("$APK_SIGNER" verify --print-certs "$GITHUB_WORKSPACE/apk/status-board.apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          RELEASE_CERT=$("$APK_SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          if [ -z "$PREVIOUS_CERT" ] || [ "$PREVIOUS_CERT" != "$RELEASE_CERT" ]; then
            echo '기존 APK와 서명 인증서가 다릅니다. 기존 앱 설정 유지를 위해 배포를 중단합니다.'
            exit 1
          fi

      - name: 폰에서 바로 받도록 사이트에 올리기
        run: |
          mkdir -p apk
          cp status-board-app/status-board-app/android/app/build/outputs/apk/release/app-release.apk apk/status-board.apk
          # 버전이 붙은 파일도 같이 (이전 버전 파일은 지워서 최신 하나만 남김)
          git rm -q --ignore-unmatch 'apk/status-board-v*.apk'
          cp apk/status-board.apk "apk/status-board-v$APP_VERSION_NAME.apk"
          echo "v$APP_VERSION_NAME · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 빌드" > apk/version.txt
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add apk/status-board.apk "apk/status-board-v$APP_VERSION_NAME.apk" apk/version.txt
          git commit -m "APK 업데이트 v$APP_VERSION_NAME" || echo '변경 없음'
          git push

      - name: APK 올리기(보관용)
        uses: actions/upload-artifact@v4
        with:
          name: status-board-apk-v${{ env.APP_VERSION_NAME }}
          path: status-board-app/status-board-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 임시 서명키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/fleet-release.keystore"
