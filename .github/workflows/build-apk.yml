name: APK 만들기

on:
  workflow_dispatch:

concurrency:
  group: apk-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 빌드할 때마다 자동으로 올라가는 앱 버전 (1.0.빌드번호)
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 서명키 준비 (항상 같은 키로 서명해야 덮어쓰기 설치가 됨)
        run: |
          mkdir -p ~/.android
          if [ -f apk/debug.keystore ]; then
            cp apk/debug.keystore ~/.android/debug.keystore
            echo '기존 서명키 사용'
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            mkdir -p apk
            cp ~/.android/debug.keystore apk/debug.keystore
            echo '서명키 새로 만들어 저장'
          fi

      - name: 사이트 화면 파일을 앱 폴더로 자동 복사
        run: |
          APPW=status-board-app/status-board-app/www
          mkdir -p $APPW
          for f in index.html payment.html fleet-auth.js manifest.json sw.js icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp "$f" "$APPW/$f"; echo "copied $f"; fi
          done

      - name: 패키지 설치
        working-directory: status-board-app/status-board-app
        run: npm install

      - name: 안드로이드 프로젝트 만들기
        working-directory: status-board-app/status-board-app
        run: npx cap add android

      - name: 서명키를 앱 폴더로 복사
        run: cp apk/debug.keystore status-board-app/status-board-app/android/app/debug.keystore

      - name: 권한·뒤로가기·설정 적용
        working-directory: status-board-app/status-board-app
        run: node scripts/setup-android.js && node scripts/setup-widget.js

      - name: 앱 아이콘 생성
        working-directory: status-board-app/status-board-app
        run: npx @capacitor/assets generate --android

      - name: 화면 파일 반영
        working-directory: status-board-app/status-board-app
        run: npx cap sync android

      - name: APK 빌드
        working-directory: status-board-app/status-board-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 폰에서 바로 받도록 사이트에 올리기
        run: |
          mkdir -p apk
          cp status-board-app/status-board-app/android/app/build/outputs/apk/debug/app-debug.apk apk/status-board.apk
          # 버전이 붙은 파일도 같이 (이전 버전 파일은 지워서 최신 하나만 남김)
          git rm -q --ignore-unmatch 'apk/status-board-v*.apk'
          cp apk/status-board.apk "apk/status-board-v$APP_VERSION_NAME.apk"
          echo "v$APP_VERSION_NAME · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 빌드" > apk/version.txt
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add apk/status-board.apk "apk/status-board-v$APP_VERSION_NAME.apk" apk/version.txt apk/debug.keystore
          git commit -m "APK 업데이트 v$APP_VERSION_NAME" || echo '변경 없음'
          git push

      - name: APK 올리기(보관용)
        uses: actions/upload-artifact@v4
        with:
          name: status-board-apk-v${{ env.APP_VERSION_NAME }}
          path: status-board-app/status-board-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
