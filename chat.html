<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차량 문의</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d1f23;--sub:#6b7280;--me:#ff7e36;--me-text:#fff;--line:#e5e7eb;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#111316;--card:#1c1f24;--text:#eceef1;--sub:#9aa1ab;--line:#2c3037;}
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;}
  header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);font-weight:700;font-size:17px;}
  header small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px;}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .b{max-width:82%;padding:10px 13px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word;}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;}
  .me{align-self:flex-end;background:var(--me);color:var(--me-text);border-top-right-radius:4px;}
  .err{align-self:center;color:#dc2626;font-size:13px;text-align:center;}
  .typing{color:var(--sub);}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;background:var(--bg);color:var(--text);max-height:120px;}
  button{border:0;border-radius:20px;padding:0 18px;background:var(--me);color:#fff;font-weight:700;font-size:15px;}
  button:disabled{opacity:.5;}
</style>
</head>
<body>
<header id="title">차량 문의<small>실시간으로 확인해서 바로 답변드려요</small></header>
<div id="log"></div>
<form id="f">
  <textarea id="t" rows="1" maxlength="500" placeholder="문의 내용을 입력하세요"></textarea>
  <button id="send">보내기</button>
</form>
<script>
  // 답변 서버 주소 (functions/index.js 의 inquiryChat)
  const API = 'https://asia-northeast3-fleet-board-f2345.cloudfunctions.net/inquiryChat';

  // 주소 예: chat.html?c=업체ID  (관리 화면 inquiry-admin.html 에서 링크를 복사하세요)
  const params = new URLSearchParams(location.search);
  const company = params.get('c') || '';
  // 홈페이지 안에 창으로 띄울 때(embed=1)는 머리글을 숨김 (홈페이지가 자체 머리글을 보여줌)
  if(params.get('embed') === '1'){
    document.getElementById('title').style.display = 'none';
    document.documentElement.style.setProperty('--me', '#0369a1'); // 홈페이지 색에 맞춤
  }
  const log = document.getElementById('log');
  const input = document.getElementById('t');
  const btn = document.getElementById('send');

  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function newId(){ return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  // 같은 폰에서는 같은 대화방을 이어서 씀
  const SID_KEY = 'inq-sid-' + company;
  let sid = store(SID_KEY) || newId();
  store(SID_KEY, sid);

  function add(cls, text){
    const d = document.createElement('div');
    d.className = 'b ' + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }
  function addErr(text){
    const d = document.createElement('div');
    d.className = 'err'; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }

  add('bot', '안녕하세요! 원하시는 차종이나 날짜를 알려주시면 지금 가능한 차량을 바로 확인해드릴게요. 예약 신청도 여기서 바로 받아요.');
  if(!/^[A-Za-z0-9_-]{4,64}$/.test(company)){
    addErr('링크가 올바르지 않아요. 업체에서 받은 링크로 다시 들어와주세요.');
    btn.disabled = true;
  }

  input.addEventListener('input', ()=>{ input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); document.getElementById('f').requestSubmit(); }
  });

  document.getElementById('f').addEventListener('submit', async e=>{
    e.preventDefault();
    const text = input.value.trim();
    if(!text || btn.disabled) return;
    input.value = ''; input.style.height = 'auto';
    add('me', text);
    btn.disabled = true;
    const typing = add('bot typing', '확인 중이에요…');
    try{
      const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ c: company, sid, text }) });
      const data = await r.json().catch(()=>({}));
      typing.remove();
      if(!r.ok){
        addErr(data.error || '잠시 후 다시 시도해주세요.');
        if(r.status === 429 && /새 대화/.test(data.error || '')){ sid = newId(); store(SID_KEY, sid); }
      } else add('bot', data.reply);
    }catch(err){
      typing.remove();
      addErr('인터넷 연결을 확인하고 다시 시도해주세요.');
    }
    btn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
