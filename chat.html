<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 상담</title>
<!--
  홈페이지(pang-rent.github.io/main)의 "AI 상담" 창이 이 주소를 불러옵니다.
  (…/chat.html?embed=1&c=업체ID)
  AI 상담 기능이 준비될 때까지는 오류 화면 대신 전화 안내를 보여줍니다.
-->
<style>
  :root{ --ink:#0f172a; --soft:#64748b; --line:#e2e8f0; --blue:#2563eb; --bg:#ffffff; --tint:#f5f7fb; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
        display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .box{ max-width:360px; width:100%; text-align:center; }
  .ic{ width:64px; height:64px; margin:0 auto 16px; border-radius:20px; background:var(--tint);
       display:flex; align-items:center; justify-content:center; font-size:30px; }
  h1{ font-size:18px; margin:0 0 8px; }
  p{ font-size:14px; line-height:1.6; color:var(--soft); margin:0 0 20px; }
  a.btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
         padding:15px; border-radius:12px; background:var(--blue); color:#fff;
         font-size:16px; font-weight:700; text-decoration:none; }
  .hours{ margin-top:12px; font-size:12px; color:var(--soft); }
</style>
</head>
<body>
  <div class="box">
    <div class="ic" aria-hidden="true">💬</div>
    <h1>AI 상담을 준비하고 있어요</h1>
    <p>곧 열려요. 지금은 전화로 문의해주시면<br>담당자가 바로 안내해드릴게요.</p>
    <a class="btn" href="tel:01051458990" target="_top">📞 010-5145-8990 전화하기</a>
    <div class="hours">광주광역시 · 전남 전지역 장기·단기 렌터카, 보험대차</div>
  </div>
</body>
</html>
